<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>分數加法動畫</title>
    <style>
        body {
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h2 {
            margin-bottom: 30px;
            color: #ffcc00;
        }
        .stage {
            width: 600px;
            height: 300px;
            background-color: #2a2a40;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            animation: fadeInOut 8s infinite;
        }
        /* 每個元素的出現時間軸動畫設定 */
        .box-1 { animation-delay: 0s; }
        .plus { font-size: 32px; color: #ff6b6b; opacity: 0; animation: fadeInOut 8s infinite; animation-delay: 2s; }
        .box-2 { animation-delay: 2s; }
        .equals { font-size: 32px; color: #4ecdc4; opacity: 0; animation: fadeInOut 8s infinite; animation-delay: 4s; }
        .box-3 { animation-delay: 4s; }

        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 10px;
        }
        /* 1/2 的圓餅圖 */
        .c1 { background: conic-gradient(#ff6b6b 0deg 180deg, #444 180deg 360deg); }
        /* 1/4 的圓餅圖 */
        .c2 { background: conic-gradient(#4ecdc4 0deg 90deg, #444 90deg 360deg); }
        /* 通分後的 3/4 圓餅圖 */
        .c3 { background: conic-gradient(#ffcc00 0deg 270deg, #444 270deg 360deg); }

        .text {
            font-size: 18px;
            font-weight: bold;
        }

        /* 動畫關鍵格：控制出現與消失的循環 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; transform: scale(1); }
            75% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        .subtitle {
            margin-top: 25px;
            font-size: 20px;
            height: 30px;
            color: #a29bfe;
        }
    </style>
</head>
<body>

    <h2>數學小動畫：分數相加</h2>
    
    <div class="stage">
        <!-- 第一個分數 -->
        <div class="box box-1">
            <div class="circle c1"></div>
            <div class="text">1 / 2</div>
        </div>

        <div class="plus">+</div>

        <!-- 第二個分數 -->
        <div class="box box-2">
            <div class="circle c2"></div>
            <div class="text">1 / 4</div>
        </div>

        <div class="equals">=</div>

        <!-- 結果 -->
        <div class="box box-3">
            <div class="circle c3"></div>
            <div class="text">3 / 4</div>
        </div>
    </div>

    <div class="subtitle">自動循環播放中...（將 1/2 通分為 2/4 後相加）</div>

</body>
</html>
